
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Student Club Members</title>
</head>

<body>

    <div class="container">
    <h1>Student Club Members</h1>
    <p class="subtitle">Manage and keep track of club members!</p>

    <div class="form-box">
    <h2>Add New Member</h2>
    <input type="text" id="fname" placeholder="Enter first name...">
    <input type="text" id="lname" placeholder="Enter last name...">
    <button py-click="add_member">Add Member</button>
    </div>
    <div class="output-box" id="output"></div>
    </div>

    <script type="py" src="main.py"></script>

</body>
